<h2 class="sr-only">Diagrama entidad-relación del sistema de reservas: Complejo, UnidadReservable, Reserva, Huesped, Usuario y Pago</h2>
<div id="erd" style="background:#ffffff; padding:16px; border-radius:12px;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: '#5f5e5a',
    textColor: '#2c2c2a',
    primaryColor: '#e6f1fb',
    primaryTextColor: '#0c447c',
    primaryBorderColor: '#185fa5',
    tertiaryColor: '#f1efe8',
  },
});
const src = `erDiagram
  COMPLEJO ||--o{ UNIDAD_RESERVABLE : tiene
  COMPLEJO ||--o{ USUARIO : emplea
  UNIDAD_RESERVABLE ||--o{ RESERVA : registra
  RESERVA ||--o{ PAGO : recibe
  RESERVA ||--o{ RESERVA_HUESPED : incluye
  HUESPED ||--o{ RESERVA_HUESPED : participa_en
  USUARIO ||--o{ RESERVA : crea

  COMPLEJO {
    string nombre
  }
  UNIDAD_RESERVABLE {
    string nombre
    string tipo
    string estado
    int capacidad
  }
  RESERVA {
    date fechaInicio
    date fechaSalida
    int cantidadPersonas
    string estado
    string plataformaProveniente
    string aclaracion
    decimal tarifa
    datetime fechaCreacion
  }
  RESERVA_HUESPED {
    boolean esTitular
  }
  HUESPED {
    string nombre
    string apellido
    string procedencia
    string mail
    string telefono
    string descripcion
    string dni
  }
  USUARIO {
    string nombre
    string mailOUsuario
    string contrasena
    string rol
  }
  PAGO {
    string tipoPago
    decimal monto
    date fecha
    string archivoUrl
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
